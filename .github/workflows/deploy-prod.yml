name: Deploy Portfolio Production

on:
  push:
    branches:
      - prod

  workflow_dispatch:

concurrency:
  group: portfolio-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        run: |
          # L'archive passe par un fichier plutôt que par un tube : une
          # tentative interrompue peut alors être rejouée à l'identique, là
          # où un tube obligerait à reconstruire l'archive et masquerait le
          # code de sortie de ssh derrière un SIGPIPE de tar.
          tar -C dist -czf "$RUNNER_TEMP/dist.tar.gz" .

          for attempt in 1 2 3 4 5; do
            if ssh \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=4 \
              -T \
              ubuntu@vps-93991c4a.vps.ovh.net < "$RUNNER_TEMP/dist.tar.gz"
            then
              echo "Deployed on attempt $attempt"
              exit 0
            fi

            delay=$((attempt * 10))
            echo "Attempt $attempt failed, retrying in ${delay}s"
            sleep "$delay"
          done

          echo "Deploy failed after 5 attempts"
          exit 1

      - name: Verify production
        run: |
          for i in {1..10}; do
            if curl -fsS https://portfolio.tomsikora.dev/ >/dev/null; then
              echo "Portfolio is online"
              exit 0
            fi

            sleep 3
          done

          echo "Portfolio healthcheck failed"
          exit 1
